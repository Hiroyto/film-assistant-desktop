name: Desktop Release

# Publica o app desktop (Windows .exe + macOS .dmg) no GitHub Releases DESTE repo.
# Pré-requisitos:
#   - Este repo deve ser o repo PÚBLICO dedicado ao desktop (a web consome os releases dele).
#   - A web aponta para ele via REACT_APP_GITHUB_REPO_OWNER / _NAME.
#
# Como disparar:
#   - Suba a versão em package.json e faça push de uma tag `vX.Y.Z`, OU
#   - rode manualmente em Actions → "Desktop Release" → Run workflow.
#
# Assinatura (opcional): preencha os secrets abaixo. Vazios = build NÃO-ASSINADO
#   (funciona, mas o usuário vê SmartScreen no Windows / Gatekeeper no macOS).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # necessário para o electron-forge criar o release e subir assets

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # gera FilmAssistantSetup.exe (Squirrel)
          - os: macos-latest     # gera .dmg (Apple Silicon / arm64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci roda o postinstall (electron-rebuild do better-sqlite3).
      - name: Install dependencies
        run: npm ci

      # Importa o certificado "Developer ID Application" num keychain temporário.
      # SEM ESTE PASSO o codesign não encontra APPLE_IDENTITY e a assinatura falha
      # (o forge cai para build não-assinado ou quebra). O keychain criado aqui
      # persiste no runner para o passo de publish abaixo.
      # Se o secret estiver vazio, é no-op: o build macOS sai NÃO-ASSINADO.
      - name: Import Apple Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "::warning::APPLE_CERT_P12_BASE64 vazio — o build macOS sairá NÃO-ASSINADO."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut: não auto-bloquear durante o build (6h) — senão o codesign falha no meio.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Libera o uso da chave privada pelo codesign sem prompt de UI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Coloca o keychain na lista de busca (e como default) para o codesign achá-lo.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

          echo "Identidades de assinatura disponíveis:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Publish to GitHub Releases
        env:
          # O CRA trata warnings como ERRO quando CI=true (o Actions seta isso sozinho).
          # Os warnings restantes são débito de lint do código LEGADO (unused-vars,
          # exhaustive-deps, ==), já aceitos como não-bloqueantes na reconstrução.
          # CI=false volta ao comportamento de warning normal (não falha o build).
          CI: 'false'
          # --- Config do app injetada no BUILD (aws-exports.js / Amplify.configure) ---
          # Sem estas, o app sai com Cognito undefined → "Auth UserPool not configured".
          # NÃO são segredos (vão embutidos no bundle público), por isso usam `vars`.
          # Defina em Settings → Secrets and variables → Actions → aba "Variables".
          REACT_APP_AWS_REGION: ${{ vars.REACT_APP_AWS_REGION }}
          REACT_APP_COGNITO_POOL_ID: ${{ vars.REACT_APP_COGNITO_POOL_ID }}
          REACT_APP_COGNITO_APP_CLIENT_ID: ${{ vars.REACT_APP_COGNITO_APP_CLIENT_ID }}
          REACT_APP_URL: ${{ vars.REACT_APP_URL }}
          REACT_APP_WEBSOCKET_URL: ${{ vars.REACT_APP_WEBSOCKET_URL }}
          REACT_APP_WEBSOCKET_ENDPOINT: ${{ vars.REACT_APP_WEBSOCKET_ENDPOINT }}
          # Forge precisa do owner/name explícitos (forge.config.js). Aponta para ESTE repo.
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          # Token padrão do Actions — tem contents:write neste repo (ver permissions acima).
          # Se você publicar num repo DIFERENTE do que roda o workflow, troque por um
          # PAT (secrets.PUBLISH_TOKEN) com contents:write no repo de releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Assinatura Windows (opcional) ---
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # --- Assinatura + notarização macOS (opcional) ---
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:publish
