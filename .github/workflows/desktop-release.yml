name: Desktop Release

# Publica o app desktop (Windows .exe + macOS .dmg) no GitHub Releases DESTE repo.
# Pré-requisitos:
#   - Este repo deve ser o repo PÚBLICO dedicado ao desktop (a web consome os releases dele).
#   - A web aponta para ele via REACT_APP_GITHUB_REPO_OWNER / _NAME.
#
# Como disparar:
#   - Canal pela TAG (job `channel`): `vX.Y.Z` = PROD (Environment `prod`, release
#     cheia — a única que o auto-update serve); `vX.Y.Z-beta.N` (qualquer sufixo
#     com hífen) = DEV (Environment `dev`, pre-release). A tag TEM de ser igual a
#     `v` + versão do package.json, porque o forge nomeia a release por ela:
#       beta:  npm version prerelease --preid=beta --no-git-tag-version  → 1.3.6-beta.0
#       prod:  npm version patch|minor --no-git-tag-version             → 1.3.6
#     commit `chore(release): …`, `git tag v…`, `git push origin main` e
#     `git push origin v…` (a tag leve NÃO vai junto com a branch).
#   - Ou manualmente em Actions → "Desktop Release" → Run workflow, escolhendo o canal.
#
# Environments (Settings → Environments): `prod` guarda as Variables de produção
#   (REACT_APP_URL, REACT_APP_WEBSOCKET_*, REACT_APP_COGNITO_*, REACT_APP_FREEFORM_API_PATH…);
#   `dev` pode ficar vazio — herda as Variables do repositório (o backend de dev).
#
# Assinatura: OBRIGATÓRIA em releases por tag (o job falha sem os secrets, a menos
#   que a Variable ALLOW_UNSIGNED_RELEASE=true esteja definida). Em workflow_dispatch
#   os secrets são opcionais: vazios = build NÃO-ASSINADO (SmartScreen / Gatekeeper).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal: dev (pre-release, Variables do repo) ou prod (release cheia, Environment prod)'
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: write        # necessário para o electron-forge criar o release e subir assets

jobs:
  # ---- Canal: a TAG decide (ver cabeçalho). Confere também tag == versão do
  # package.json: o forge nomeia a release pela versão do package.json, então
  # uma tag diferente subiria os assets para a release errada — depois de
  # 20 minutos de build.
  channel:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            name="${INPUT_CHANNEL:-dev}"
          else
            pkg="v$(node -p "require('./package.json').version")"
            if [ "$TAG" != "$pkg" ]; then
              echo "::error::Tag $TAG != package.json $pkg. O forge nomeia a release pela versão do package.json: suba a versão (npm version …) antes de taguear."
              exit 1
            fi
            case "$TAG" in
              *-*) name=dev ;;
              *)   name=prod ;;
            esac
          fi
          echo "Canal: $name ($EVENT $TAG)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  publish:
    needs: channel
    # O Environment escolhe as Variables (REACT_APP_* do passo de publish): `prod`
    # tem as URLs, o pool e o domínio de produção; `dev` pode ficar vazio e herdar
    # as Variables do repositório (o backend de desenvolvimento, como hoje).
    environment: ${{ needs.channel.outputs.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # gera FilmAssistantSetup.exe (Squirrel)
          - os: macos-latest     # gera .dmg (Apple Silicon / arm64)
    runs-on: ${{ matrix.os }}
    # Rede de segurança: assinatura/notarização podem TRAVAR (codesign esperando
    # autorização de keychain, ou notarytool aguardando a Apple indefinidamente).
    # Sem isto o job fica horas pendurado. Tempo normal: ~15-30 min no total.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # piso das deps: electron 42, @electron/rebuild 4, node-abi 4, pdfjs-dist 6.3 exigem >= 22.12; better-sqlite3 12 só tem prebuild para Node >= 22
          cache: npm

      # Release por TAG exige assinatura: o auto-update (Squirrel / update-electron-app)
      # confia só em HTTPS + GitHub Releases, então um pacote não-assinado no release
      # seria aceito pelos clientes. Para publicar sem assinatura conscientemente
      # (ex.: canal beta interno), defina a Variable ALLOW_UNSIGNED_RELEASE=true.
      # workflow_dispatch manual continua livre (builds de teste).
      - name: Require code-signing secrets on release tags
        if: startsWith(github.ref, 'refs/tags/') && vars.ALLOW_UNSIGNED_RELEASE != 'true'
        shell: bash
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          missing=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            [ -n "$WINDOWS_CERT_PFX_BASE64" ] || missing+=(WINDOWS_CERT_PFX_BASE64)
            [ -n "$WINDOWS_CERT_PASSWORD" ] || missing+=(WINDOWS_CERT_PASSWORD)
          else
            [ -n "$APPLE_IDENTITY" ] || missing+=(APPLE_IDENTITY)
            [ -n "$APPLE_CERT_P12_BASE64" ] || missing+=(APPLE_CERT_P12_BASE64)
            [ -n "$APPLE_ID" ] || missing+=(APPLE_ID)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release em tag sem assinatura de código. Secrets ausentes: ${missing[*]}. Configure-os ou defina a Variable ALLOW_UNSIGNED_RELEASE=true para publicar não-assinado de propósito."
            exit 1
          fi
          echo "Secrets de assinatura presentes para $RUNNER_OS."

      # npm ci roda o postinstall (electron-rebuild do better-sqlite3).
      #
      # O .npmrc do repo (runtime=electron / target / disturl) existe para a MÁQUINA
      # DE DEV sem Python: faz o prebuild-install baixar o binário do better-sqlite3
      # já compilado para a ABI do Electron. No CI ele é PREJUDICIAL: vale para todo
      # node-gyp do install, e os módulos nativos OPCIONAIS do appdmg (fs-xattr,
      # macos-alias — só macOS, sem prebuild) passam a compilar contra os headers do
      # Electron, falham, e o npm descarta a subárvore opcional inteira. O sintoma
      # aparece só no make: "Cannot find module 'appdmg'" no maker-dmg (v1.1.0).
      # Os runners têm toolchain: instala-se para o Node do sistema e o postinstall
      # recompila o better-sqlite3 para o Electron — exatamente como no 1.0.2.
      - name: Install dependencies
        shell: bash
        run: |
          rm -f .npmrc
          npm ci

      # Importa o certificado "Developer ID Application" num keychain temporário.
      # SEM ESTE PASSO o codesign não encontra APPLE_IDENTITY e a assinatura falha
      # (o forge cai para build não-assinado ou quebra). O keychain criado aqui
      # persiste no runner para o passo de publish abaixo.
      # Se o secret estiver vazio, é no-op: o build macOS sai NÃO-ASSINADO.
      - name: Import Apple Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "::warning::APPLE_CERT_P12_BASE64 vazio — o build macOS sairá NÃO-ASSINADO."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"
          B64_PATH="$RUNNER_TEMP/apple-cert.b64"

          # Remove QUALQUER espaço em branco (quebras de linha, CR do Windows,
          # espaços colados junto na hora de salvar o secret) — a causa mais comum
          # de "error decoding base64 input stream".
          printf '%s' "$APPLE_CERT_P12_BASE64" | tr -d '[:space:]' > "$B64_PATH"

          # Diagnóstico seguro: só o TAMANHO (não o valor). Compare com o tamanho
          # do seu apple-cert.p12.base64 local — se divergir, o secret veio truncado.
          echo "Secret base64: $(wc -c < "$B64_PATH") caracteres (após limpar espaços)."

          # openssl é mais portátil que o `base64` do BSD/macOS; -A = entrada em 1 linha.
          if ! openssl base64 -d -A -in "$B64_PATH" -out "$CERT_PATH" 2>/dev/null; then
            echo "::error::Falha ao decodificar APPLE_CERT_P12_BASE64. Regenere com:"
            echo "::error::openssl base64 -A -in apple-cert.p12 -out apple-cert.p12.base64"
            echo "::error::e cole o conteúdo INTEIRO do arquivo (uma linha só, sem quebras)."
            exit 1
          fi
          rm -f "$B64_PATH"

          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::O .p12 decodificado está vazio — secret incompleto."
            exit 1
          fi
          echo "Certificado decodificado: $(wc -c < "$CERT_PATH") bytes."

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut: não auto-bloquear durante o build (6h) — senão o codesign falha no meio.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Libera o uso da chave privada pelo codesign sem prompt de UI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Coloca o keychain na lista de busca (e como default) para o codesign achá-lo.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

          echo "Identidades de assinatura disponíveis:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Windows Authenticode: o forge (forge.config.js) recebe WINDOWS_CERT_FILE como
      # CAMINHO de um .pfx — que precisa existir no runner. Este passo decodifica o
      # secret WINDOWS_CERT_PFX_BASE64 (o .pfx em base64, 1 linha) em $RUNNER_TEMP e
      # publica o caminho em GITHUB_ENV para o passo de publish. Secret vazio = no-op:
      # o build Windows sai NÃO-ASSINADO (o gate acima já decidiu se isso é aceitável).
      - name: Materialize Windows code-signing certificate (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_PFX_BASE64:-}" ]; then
            echo "::warning::WINDOWS_CERT_PFX_BASE64 vazio — o build Windows sairá NÃO-ASSINADO."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/win-cert.pfx"
          B64_PATH="$RUNNER_TEMP/win-cert.b64"
          printf '%s' "$WINDOWS_CERT_PFX_BASE64" | tr -d '[:space:]' > "$B64_PATH"
          echo "Secret base64: $(wc -c < "$B64_PATH") caracteres (após limpar espaços)."
          if ! openssl base64 -d -A -in "$B64_PATH" -out "$CERT_PATH" 2>/dev/null; then
            echo "::error::Falha ao decodificar WINDOWS_CERT_PFX_BASE64. Regenere com:"
            echo "::error::openssl base64 -A -in cert.pfx -out cert.pfx.base64"
            echo "::error::e cole o conteúdo INTEIRO do arquivo (uma linha só, sem quebras)."
            exit 1
          fi
          rm -f "$B64_PATH"
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::O .pfx decodificado está vazio — secret incompleto."
            exit 1
          fi
          echo "Certificado decodificado: $(wc -c < "$CERT_PATH") bytes."
          echo "WINDOWS_CERT_FILE=$CERT_PATH" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        env:
          # O CRA trata warnings como ERRO quando CI=true (o Actions seta isso sozinho).
          # Os warnings restantes são débito de lint do código LEGADO (unused-vars,
          # exhaustive-deps, ==), já aceitos como não-bloqueantes na reconstrução.
          # CI=false volta ao comportamento de warning normal (não falha o build).
          CI: 'false'
          # --- Config do app injetada no BUILD (aws-exports.js / Amplify.configure) ---
          # Sem estas, o app sai com Cognito undefined → "Auth UserPool not configured".
          # NÃO são segredos (vão embutidos no bundle público), por isso usam `vars`.
          # Defina em Settings → Secrets and variables → Actions → aba "Variables".
          REACT_APP_AWS_REGION: ${{ vars.REACT_APP_AWS_REGION }}
          REACT_APP_COGNITO_POOL_ID: ${{ vars.REACT_APP_COGNITO_POOL_ID }}
          REACT_APP_COGNITO_APP_CLIENT_ID: ${{ vars.REACT_APP_COGNITO_APP_CLIENT_ID }}
          REACT_APP_URL: ${{ vars.REACT_APP_URL }}
          REACT_APP_WEBSOCKET_URL: ${{ vars.REACT_APP_WEBSOCKET_URL }}
          REACT_APP_WEBSOCKET_ENDPOINT: ${{ vars.REACT_APP_WEBSOCKET_ENDPOINT }}
          # Desliga o mock da API freeform (isMockMode). Sem isto, o build sai com
          # dados MOCK. NÃO é segredo (path público no bundle) → usa `vars`. Defina
          # a Variable REACT_APP_FREEFORM_API_PATH = freeform (aba "Variables").
          REACT_APP_FREEFORM_API_PATH: ${{ vars.REACT_APP_FREEFORM_API_PATH }}
          # Reveal card a card no corkboard (o site usa "true"); vazio = desligado.
          REACT_APP_FREEFORM_STREAMING: ${{ vars.REACT_APP_FREEFORM_STREAMING }}
          # Login com Google (opcional): domínio do Hosted UI do Cognito. Entra no
          # bundle (o botão "Continue with Google" só aparece com ele) e na CSP do
          # desktop (connect-src da troca do code). Sem a Variable o botão some e
          # nada mais muda. As listas de redirect NÃO são necessárias aqui: o
          # desktop volta sempre por filmassistant://auth/callback. Ver GOOGLE-SIGN-IN.md.
          REACT_APP_COGNITO_OAUTH_DOMAIN: ${{ vars.REACT_APP_COGNITO_OAUTH_DOMAIN }}
          # Local-first no desktop (src/lib/localFirst.ts). DESLIGADO por padrão:
          # sem a Variable o build sai em modo web (grade e saves direto no backend).
          REACT_APP_LOCAL_FIRST: ${{ vars.REACT_APP_LOCAL_FIRST }}
          # Canal da release (forge.config.js): `prod` publica release cheia — a que o
          # auto-update (update.electronjs.org) serve; qualquer outro = pre-release.
          RELEASE_CHANNEL: ${{ needs.channel.outputs.name }}
          # Forge precisa do owner/name explícitos (forge.config.js). Aponta para ESTE repo.
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          # Token padrão do Actions — tem contents:write neste repo (ver permissions acima).
          # Se você publicar num repo DIFERENTE do que roda o workflow, troque por um
          # PAT (secrets.PUBLISH_TOKEN) com contents:write no repo de releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Assinatura Windows (opcional) --- caminho do .pfx materializado acima.
          WINDOWS_CERT_FILE: ${{ env.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # --- Assinatura + notarização macOS (opcional) ---
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Logs verbosos de assinatura/notarização. Sem isto o Forge fica mudo em
          # "Finalizing package" e não dá para saber se travou no codesign ou se está
          # apenas aguardando a Apple analisar o upload da notarização.
          DEBUG: '@electron/osx-sign*,@electron/notarize*,electron-osx-sign*,electron-notarize*'
        run: npm run desktop:publish
